    <div class="page-container">
        <div class="login-card">
            <h1 class="title">Login</h1>
            <p class="subtitle">Bem-vindo de volta! Por favor, insira seus dados.</p>
            
            <form onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <div class="input-wrapper">
                       <img src="../IMG/email.svg" 
                         alt="Ícone de Email" 
                         class="input-icon">
                        <input type="email" id="email" placeholder="Insira seu email">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <div class="input-wrapper">
                       <img src="../IMG/cadeado-senha.svg" 
                         alt="Ícone de Senha" 
                         class="input-icon">
                        <input type="password" id="password" placeholder="Digite sua senha">

                        <!-- olho fechado -->
                    <img class="olho-fechado" width="24" height="24" src="../IMG/olho-fechado.svg" alt="Ícone de olho fechado">

                    

                    
                    
                    <!-- olho aberto -->
                    <img class="olho-aberto" width="24" height="24" src="../IMG/olho-aberto.svg" alt="Ícone de olho aberto">

                        </div>
                    </div>
                    
                    
                    <div class="form-options">
                    <label class="lembrar-senha">
                        <div class="checkbox">
                            <img src="../IMG/check.svg" 
                            alt="Ícone de check" 
                            class="check-icon"
                            width="10"
                            height="10">
                        </div>
                        <span>Lembrar da senha</span>
                    </label>
                    
                    <a href="#" class="forgot-password">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn-submit">Entrar</button>
                
                <div class="divider">
                    <span>OU</span>
                </div>
                
                <div class="social-login">
                    <button type="button" class="btn-social">
                        <img src="../IMG/google.svg" 
                        alt="Ícone do Google" 
                        class="social-icon">
                        Google
                    </button>
                    <button type="button" class="btn-social">
                        <img src="../IMG/apple.svg" 
                        alt="Ícone da Apple" 
                        class="social-icon">
                        Apple
                    </button>
                </div>
                
                <p class="signup-prompt">
                    Não tem uma conta? <a href="cadastro-usuario.html">Cadastre-se</a>
                </p>
            </form>
        </div>
        
        <footer class="footer-links">
            <a href="#">Terms of Service</a>
            <a href="#">Privacy Policy</a>
        </footer>
