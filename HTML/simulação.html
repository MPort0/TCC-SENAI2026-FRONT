<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/temas.css">
    <link rel="stylesheet" href="../CSS/sidebar.css">
    <link rel="stylesheet" href="../CSS/simulação.css">
    <script src="../JS/temas.js" defer></script>
    <title>Simulação</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="../IMG/favicon.ico">
</head>

<body>
    <div class="app">
        <!-- SIDEBAR CONTAINER -->
        <aside class="sidebar">

            <!-- Topo / Header -->
            <div class="sidebar-header">
                <div class="logo-badge">
                    <img src="../IMG/logo-roxa.svg">
                </div>
                <div class="brand-title">
                    <span class="brand-dark">AVA.</span>
                    <span class="brand-blue">Lia</span>
                </div>
            </div>

            <!-- Navegação Principal -->
            <nav class="nav-section">
                <a href="home.html" class="nav-item active">
                    <i data-lucide="home"></i>
                    <img src="../IMG/home.svg">
                    <span>Início</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="file-text"></i>
                    <img src="../IMG/file-text.svg">
                    <span>Criar currículo</span>
                </a>
                <a href="simulação.html" class="nav-item">
                    <i data-lucide="play-circle"></i>
                    <img src="../IMG/circle-play.svg">
                    <span>Simulação</span>
                </a>
                <a href="historico.html" class="nav-item">
                    <i data-lucide="history"></i>
                    <img src="../IMG/clock-3.svg">
                    <span>Histórico</span>
                </a>
                <a href="perfil.html" class="nav-item">
                    <i data-lucide="user"></i>
                    <img src="../IMG/user-circle.svg">
                    <span>Perfil</span>
                </a>
            </nav>

            <!-- Rodapé / Usuário + Links -->
            <div class="sidebar-footer">

                <!-- Card do Usuário -->
                <div class="user-card">
                    <div class="user-avatar">
                        <i data-lucide="user"></i>
                    </div>
                    <div class="user-info">
                        <span class="user-nome">Olá, usuário!</span>
                        <span class="user-email">hello_lia@useia.com.br</span>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- Links Inferiores -->
                <nav class="bottom-nav">
                    <a href="#" class="nav-item">
                        <i data-lucide="settings"></i>
                        <img src="../IMG/configuracoes.svg">
                        <span>Configurações</span>
                    </a>
                    <a href="#" class="nav-item">
                        <i data-lucide="headphones"></i>
                        <img src="../IMG/suporte.svg">
                        <span>Suporte</span>
                    </a>
                    <a href="#" class="nav-item">
                        <i data-lucide="log-out"></i>
                        <img src="../IMG/sair.svg">
                        <span>Sair</span>
                    </a>
                </nav>

            </div>

        </aside>
        <!-- CONTEÚDO PRINCIPAL -->
        <main class="main-content">

            <h1>Monte sua base</h1>

            <p class="subtitle">
                Escolha o cargo, a tecnologia e o seu nível de dificuldade.
            </p>

            <!-- CARGO -->
            <section class="selection-section">

            <div class="opcoes">
                <h2>Cargo:</h2>

                <div class="options">

                    <button class="option">Estagiário</button>

                    <button class="option">
                        Desenvolvedor Júnior
                    </button>

                    <button class="option">
                        Desenvolvedor Front-End
                    </button>

                    <button class="option">
                        Desenvolvedor Back-End
                    </button>

                    <button class="option">
                        Full Stack
                    </button>

                </div>

            </div>

            </section>


            <!-- TECNOLOGIA -->
            <section class="selection-section">

            <div class="opcoes">
                <h2>Tecnologia:</h2>

                <div class="options">

                    <button class="option">Java</button>

                    <button class="option">Javascript</button>

                    <button class="option">PHP</button>

                    <button class="option">C#</button>

                    <button class="option">Python</button>

                    <button class="option">SQL</button>

                    <button class="option">HTML/CSS</button>

                    <button class="option">Git</button>

                    <button class="option">APIs</button>

                    <button class="option">Banco de Dados</button>

                </div>
            </div>
            </section>

            <!-- DIFICULDADE -->
            <section class="selection-section difficulty">

            <div class="opcoes">
                <h2>Dificuldade:</h2>

                <div class="options">

                    <button class="option">Fácil</button>

                    <button class="option">Média</button>

                    <button class="option">Difícil</button>

                </div>
            </div>
            </section>

            <!-- BOTÃO -->
            <button class="start-button">
                <span>Iniciar entrevista com LIA</span>
                <span class="play-icon">▷</span>
            </button>
        </main>

        <!-- BOTÃO DE SUPORTE FLUTUANTE -->
        <button class="floating-support" onclick="openSupport()">
            <span>✉</span>
        </button>
    </div>
    <script src="../JS/simulação.js"></script>
</body>

</html>
