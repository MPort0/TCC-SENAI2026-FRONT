<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/temas.css">
    <link rel="stylesheet" href="../CSS/cadastro.css">
    <script src="../JS/temas.js" defer></script>
    <script src="../JS/cadastro.js" defer></script>
    <title>Criar Conta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="../IMG/favicon.ico">
</head>

<body>

    <div class="register-card">
        <a href="../HTML/login-usuario.html" class="btn-back">
            <img src="../IMG/seta-voltar.svg" alt="Voltar">
            Voltar
        </a>

        <h1 class="title">Criar conta</h1>

        <form id="formCadastro">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Insira seu nome">
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="Insira seu e-mail">
            </div>

            <div class="form-group">
                <label for="senha">Senha:</label>
                <div class="input-wrapper">
                    <input type="password" id="senha" placeholder="Digite sua senha">
                    <img src="../IMG/ocultar-senha.svg" id="icone-senha" alt="Ocultar senha" class="toggle-icon"
                        onclick="toggleSenha()">
                </div>
            </div>

            <!-- IDS ALINHADOS COM O JS -->
            <ul id="regras-senha">
                <li id="regra-caracteres">Mínimo de 8 caracteres</li>
                <li id="regra-maiuscula">Pelo menos uma letra maiúscula</li>
                <li id="regra-minuscula">Pelo menos uma letra minúscula</li>
                <li id="regra-numero">Pelo menos um número</li>
                <li id="regra-especial">Pelo menos um caractere especial</li>
            </ul>

            <div class="form-group">
                <label for="confirmar-senha">Confirmar senha:</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmar-senha" placeholder="Confirme sua senha">
                    <img src="../IMG/ocultar-senha.svg" id="icone-confirmarSenha" alt="Ocultar senha"
                        class="toggle-icon" onclick="toggleConfirmar()">
                </div>
                <button type="submit" class="btn-submit">Criar conta</button>
            </div>

        </form>
    </div>

</body>


<script src="../JS/ipback.js"></script>

</html>
