<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/temas.css">
    <link rel="stylesheet" href="../CSS/sidebar.css">
    <link rel="stylesheet" href="../CSS/simulacao-corrida.css">
    <script src="../JS/ipback.js"></script>
    <script src="../JS/temas.js" defer></script>
    <script src="../JS/sidebar.js" defer></script>
    <title>Entrevista com a Lia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="../IMG/favicon.ico">


</head>

<body>
    <div class="app">
        <!-- BARRA LATERAL -->
        <aside class="sidebar">

            <!-- Topo / Header -->
            <div class="sidebar-header">
                <div class="logo-badge">
                    <img src="../IMG/logo-branca.svg" alt="Logo">
                </div>

                <div class="brand-title">
                    <span class="brand-dark">AVA.</span>
                    <span class="brand-blue">Lia</span>
                </div>
            </div>

            <!-- Navegação Principal -->
            <nav class="nav-section">
                <a href="../HTML/home.html" class="nav-item">
                    <i data-lucide="home"></i>
                    <span>Início</span>
                </a>
                <a href="../HTML/novo-curriculo.html" class="nav-item">
                    <i data-lucide="file-text"></i>
                    <span>Criar currículo</span>
                </a>
                <a href="../HTML/simulacao.html" class="nav-item">
                    <i data-lucide="play-circle"></i>
                    <span>Simulação</span>
                </a>
                <a href="../HTML/historico.html" class="nav-item">
                    <i data-lucide="history"></i>
                    <span>Histórico</span>
                </a>
                <a href="../HTML/perfil.html" class="nav-item">
                    <i data-lucide="user"></i>

                    <span>Perfil</span>
                </a>

            </nav>

            <!-- Rodapé / Usuário + Links -->
            <div class="sidebar-footer">

                <!-- Card do Usuário -->
                <div class="user-card">
                    <div class="user-avatar">
                        <i data-lucide="user-round"></i>
                    </div>

                    <div class="user-info">
                        <span class="user-nome">Olá, usuário!</span>
                        <span class="user-email">hello_lia@useia.com.br</span>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- Links Inferiores -->
                <a href="../HTML/login.html" class="nav-item">
                    <i data-lucide="log-out"></i>
                    <span>Sair</span>
                </a>

            </div>

        </aside>
        <!-- CONTEÚDO DA ENTREVISTA -->

<main class="interview">

    <section class="chat" id="chat-messages">
    </section>

    <div class="input-area">

        <button type="button" class="add-button" onclick="toggleMenu()">
            <i data-lucide="plus"></i>
        </button>

        <textarea
            id="messageInput"
            placeholder="Pergunte qualquer coisa"
            rows="1"></textarea>

        <div class="add-menu" id="addMenu">

            <button
                type="button"
                onclick="document.getElementById('fileInput').click()">

                <i data-lucide="paperclip"></i>
                Anexar arquivo
            </button>

            <input
                type="file"
                id="fileInput"
                hidden
                multiple
                accept="image/*,.pdf,.doc,.docx,.txt">
        </div>

        <button type="button" class="send-button">
            <i data-lucide="send-horizontal"></i>
        </button>

    </div>

</main>

    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../JS/simulacaoCorrida.js" defer></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
