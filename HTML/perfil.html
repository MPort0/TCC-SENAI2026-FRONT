<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/temas.css">
    <link rel="stylesheet" href="../CSS/sidebar.css">
    <link rel="stylesheet" href="../CSS/perfil.css">
    <script src="../JS/temas.js" defer></script>
    <title>Perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="../IMG/favicon.ico">

</head>

<body>
    <div class="app">
        <!-- SIDEBAR CONTAINER -->
        <aside class="sidebar">

            <!-- Topo / Header -->
            <div class="sidebar-header">
                <div class="logo-badge">
                    <img src="../IMG/logo-roxa.svg">
                </div>
                <div class="brand-title">
                    <span class="brand-dark">AVA.</span>
                    <span class="brand-blue">Lia</span>
                </div>
            </div>

            <!-- Navegação Principal -->
            <nav class="nav-section">
                <a href="#" class="nav-item active">
                    <i data-lucide="home"></i>
                    <img src="../IMG/home.svg">
                    <span>Início</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="file-text"></i>
                    <img src="../IMG/file-text.svg">
                    <span>Criar currículo</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="play-circle"></i>
                    <img src="../IMG/circle-play.svg">
                    <span>Simulação</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="history"></i>
                    <img src="../IMG/clock-3.svg">
                    <span>Histórico</span>
                </a>
                <a href="#" class="nav-item">
                    <i data-lucide="user"></i>
                    <img src="../IMG/user-circle.svg">
                    <span>Perfil</span>
                </a>
            </nav>

            <!-- Rodapé / Usuário + Links -->
            <div class="sidebar-footer">

                <!-- Card do Usuário -->
                <div class="user-card">
                    <div class="user-avatar">
                        <i data-lucide="user"></i>
                    </div>
                    <div class="user-info">
                        <span class="user-nome">Olá, usuário!</span>
                        <span class="user-email">hello_lia@useia.com.br</span>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- Links Inferiores -->
                <nav class="bottom-nav">
                    <a href="#" class="nav-item">
                        <i data-lucide="settings"></i>
                        <img src="../IMG/configuracoes.svg">
                        <span>Configurações</span>
                    </a>
                    <a href="#" class="nav-item">
                        <i data-lucide="headphones"></i>
                        <img src="../IMG/suporte.svg">
                        <span>Suporte</span>
                    </a>
                    <a href="#" class="nav-item">
                        <i data-lucide="log-out"></i>
                        <img src="../IMG/sair.svg">
                        <span>Sair</span>
                    </a>
                </nav>

            </div>

        </aside>

        <main class="content">
            <section class="profile-section">
                <h1>Meus dados</h1>

                <div class="user-heading">
                    <div class="avatar">U</div>
                    <div>
                        <div class="user-name">
                            User
                            <span>
                                <svg width="30" height="30" viewBox="0 0 30 30" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M15 11.25C17.4162 11.25 19.375 9.29125 19.375 6.875C19.375 4.45875 17.4162 2.5 15 2.5C12.5838 2.5 10.625 4.45875 10.625 6.875C10.625 9.29125 12.5838 11.25 15 11.25Z"
                                        stroke="white" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                    <path
                                        d="M2.5 25.625C2.5 20.1019 7.53688 15.625 13.75 15.625M19.375 26.25L25.625 20L23.125 17.5L16.875 23.75V26.25H19.375Z"
                                        stroke="white" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                </svg>
                            </span>
                        </div>
                        <div class="user-subtitle">Usuário cadastrado</div>
                    </div>
                </div>



                <!-- Botão de alternância de tema -->
                <button type="button" id="theme-toggle" class="theme-toggle-btn" aria-label="Alternar tema">
                    <!-- Ícone de Sol (visível no modo escuro) -->
                    <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor"
                        stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <!-- Ícone de Lua (visível no modo claro) -->
                    <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor"
                        stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <span id="theme-toggle-text">Modo Escuro</span>
                </button>










                <form class="profile-form">
                    <label for="name">Nome:</label>
                    <input id="name" type="text" placeholder="Arthur">

                    <label for="email">Email:</label>
                    <input id="email" type="email" placeholder="adm@gmail.com">

                    <button class="salvar-alteracoes" type="button">Salvar alterações</button>
                </form>
            </section>

            <hr>

            <section class="curriculos">
                <h2>Meus currículos</h2>

                <div class="resume-grid">
                    <article class="resume-card">
                        <button class="card-edit" aria-label="Editar currículo">
                            <svg width="37" height="37" viewBox="0 0 37 37" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M25.3989 8.33731L28.6626 11.601M27.4971 5.4621L18.668 14.2912C18.2104 14.7458 17.899 15.3266 17.7738 15.9593L16.9583 20.0416L21.0406 19.2246C21.6727 19.0981 22.2523 18.7883 22.7087 18.3319L31.5378 9.50281C31.8031 9.23749 32.0136 8.92252 32.1572 8.57586C32.3007 8.22921 32.3747 7.85767 32.3747 7.48246C32.3747 7.10724 32.3007 6.7357 32.1572 6.38905C32.0136 6.0424 31.8031 5.72742 31.5378 5.4621C31.2725 5.19679 30.9575 4.98632 30.6108 4.84274C30.2642 4.69915 29.8927 4.62524 29.5174 4.62524C29.1422 4.62524 28.7707 4.69915 28.424 4.84274C28.0774 4.98632 27.7624 5.19679 27.4971 5.4621Z"
                                    stroke="#98AACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                <path
                                    d="M29.2916 23.1249V27.7499C29.2916 28.5677 28.9668 29.3519 28.3885 29.9302C27.8103 30.5084 27.026 30.8333 26.2083 30.8333H9.24996C8.43221 30.8333 7.64795 30.5084 7.06971 29.9302C6.49148 29.3519 6.16663 28.5677 6.16663 27.7499V10.7916C6.16663 9.97383 6.49148 9.18958 7.06971 8.61134C7.64795 8.0331 8.43221 7.70825 9.24996 7.70825H13.875"
                                    stroke="#98AACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>

                        </button>

                    </article>

                    <article class="resume-card empty">
                        <button class="card-edit" aria-label="Editar currículo">
                            <svg width="37" height="37" viewBox="0 0 37 37" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M25.3989 8.33731L28.6626 11.601M27.4971 5.4621L18.668 14.2912C18.2104 14.7458 17.899 15.3266 17.7738 15.9593L16.9583 20.0416L21.0406 19.2246C21.6727 19.0981 22.2523 18.7883 22.7087 18.3319L31.5378 9.50281C31.8031 9.23749 32.0136 8.92252 32.1572 8.57586C32.3007 8.22921 32.3747 7.85767 32.3747 7.48246C32.3747 7.10724 32.3007 6.7357 32.1572 6.38905C32.0136 6.0424 31.8031 5.72742 31.5378 5.4621C31.2725 5.19679 30.9575 4.98632 30.6108 4.84274C30.2642 4.69915 29.8927 4.62524 29.5174 4.62524C29.1422 4.62524 28.7707 4.69915 28.424 4.84274C28.0774 4.98632 27.7624 5.19679 27.4971 5.4621Z"
                                    stroke="#98AACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                <path
                                    d="M29.2916 23.1249V27.7499C29.2916 28.5677 28.9668 29.3519 28.3885 29.9302C27.8103 30.5084 27.026 30.8333 26.2083 30.8333H9.24996C8.43221 30.8333 7.64795 30.5084 7.06971 29.9302C6.49148 29.3519 6.16663 28.5677 6.16663 27.7499V10.7916C6.16663 9.97383 6.49148 9.18958 7.06971 8.61134C7.64795 8.0331 8.43221 7.70825 9.24996 7.70825H13.875"
                                    stroke="#98AACA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>

                        </button>
                    </article>
                </div>
            </section>
        </main>

        <button class="lia">
            <svg width="58" height="58" viewBox="0 0 58 58" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="58" height="58" rx="8" fill="#5F7FBF" />
                <path
                    d="M24.4281 33.2419C25.1775 33.9783 26.0893 34.5257 27.0918 34.8416C28.0944 35.1574 29.1611 35.2333 30.2077 35.0626L37.0754 33.9424L35.881 37.5889C35.8332 37.7357 35.7573 37.8724 35.6578 37.9908C35.5584 38.1091 35.4374 38.2073 35.3014 38.2791L35.2966 38.2794L35.2937 38.2816L35.2755 38.2908L35.2286 38.3157L35.0559 38.3988C34.1637 38.8065 33.2375 39.1299 32.2892 39.3637C30.5268 39.7968 28.1003 40.0678 25.6346 39.2911C23.1688 38.5142 21.359 36.9084 20.1813 35.549C19.5901 34.8625 19.1449 34.2244 18.8463 33.7532C18.6956 33.5136 18.5832 33.3238 18.5076 33.185L18.4164 33.0185L18.3808 32.9555L18.3795 32.9478C18.3112 32.8118 18.2695 32.6626 18.2586 32.5095C18.2477 32.3564 18.2677 32.202 18.3158 32.0551L19.5092 28.4107L24.4281 33.2419ZM30.2388 19.0238C30.9063 18.9272 31.5836 18.981 32.2215 19.182C32.8593 19.3829 33.442 19.7257 33.9272 20.1854L42.9393 28.7163C43.0962 28.8647 43.2075 29.0555 43.2608 29.2672C43.3139 29.4789 43.3069 29.7032 43.2401 29.9135C43.1732 30.124 43.0491 30.3126 42.8825 30.4574C42.716 30.6021 42.5134 30.6972 42.2981 30.7321L29.8887 32.7531C29.1952 32.8664 28.4878 32.8161 27.8234 32.6068C27.1593 32.3975 26.5553 32.035 26.059 31.547L18.4935 24.1158L16.8514 29.1288C16.7544 29.425 16.5461 29.6734 16.2717 29.8181C15.9973 29.9627 15.6791 29.992 15.388 29.9004C15.097 29.8087 14.8564 29.6031 14.7191 29.3289C14.5818 29.0546 14.5583 28.7335 14.6553 28.4372L16.8697 21.6787C16.9313 21.4544 17.0568 21.2519 17.2307 21.0974C17.4047 20.9429 17.6194 20.8431 17.847 20.8106L30.2388 19.0238Z"
                    fill="white" />
            </svg>

        </button>
    </div>
</body>

</html>
